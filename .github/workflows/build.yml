name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Quitty.app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Zip
        run: ditto -c -k --keepParent build/Quitty.app build/Quitty.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Quitty
          path: build/Quitty.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Quitty.zip
          generate_release_notes: true
