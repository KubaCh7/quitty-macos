name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build Quitty.app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Build Quitty.dmg
        run: ./scripts/build-dmg.sh

      # A broken signature makes macOS call the app damaged, with no
      # "Open Anyway" option, so check the copy people actually get.
      - name: Check the app inside the DMG
        run: |
          MOUNT="$(mktemp -d)"
          hdiutil attach build/Quitty.dmg -nobrowse -readonly -mountpoint "$MOUNT"
          codesign --verify --deep --strict --verbose=2 "$MOUNT/Quitty.app"
          hdiutil detach "$MOUNT"

      # The in-app updater downloads the zip; people download the DMG.
      - name: Zip
        run: ditto -c -k --keepParent build/Quitty.app build/Quitty.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Quitty
          path: |
            build/Quitty.dmg
            build/Quitty.zip

      - name: Read version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      # Pushing a new version to the default branch publishes it as a release.
      - name: Check for an existing release
        id: release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            build/Quitty.dmg
            build/Quitty.zip
          generate_release_notes: true
